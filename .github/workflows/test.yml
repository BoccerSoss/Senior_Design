name: Python checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned binary dependency
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
      - name: Check environment
        run: python scripts/aip.py doctor
      - name: Run tests
        run: python scripts/test.py
      - name: Exercise public CLI commands
        run: python scripts/smoke_commands.py
      - name: Run image experiment controls
        run: python scripts/aip.py demo --out runs/ci-demo
